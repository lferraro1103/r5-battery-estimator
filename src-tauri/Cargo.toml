[package]
name = "r5-battery-estimator"
version = "0.1.0"
description = "Monitor local de batería para Attack Shark R5 Ultra"
edition = "2024"

[lib]
name = "r5_battery_estimator"
path = "src/lib.rs"

[[bin]]
name = "r5-battery-estimator"
path = "src/main.rs"

[[bin]]
name = "r5-battery-probe"
path = "src/probe.rs"

[[bin]]
name = "r5-battery-estimator-v2"
path = "src/native_v2.rs"

[dependencies]
tauri = { version = "=2.12.0", features = ["tray-icon"] }
hidapi = { version = "=2.6.7", default-features = false, features = ["windows-native"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
chrono = "=0.4.42"
thiserror = "=2.0.21"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = "=2.7.0"

